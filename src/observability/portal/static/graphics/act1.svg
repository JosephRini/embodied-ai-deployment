<svg viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, sans-serif">
  <!-- frozen policy -->
  <rect x="20" y="70" width="90" height="50" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="0.5"/>
  <text x="65" y="90" font-size="12" text-anchor="middle" fill="#333">policy</text>
  <text x="65" y="104" font-size="12" text-anchor="middle" fill="#333">(frozen)</text>

  <!-- fan-out lines to trials -->
  <line x1="110" y1="95" x2="230" y2="30" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="95" x2="230" y2="55" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="95" x2="230" y2="80" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="95" x2="230" y2="105" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="95" x2="230" y2="130" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="95" x2="230" y2="155" stroke="#bbb" stroke-width="0.5"/>
  <line x1="110" y1="95" x2="230" y2="180" stroke="#bbb" stroke-width="0.5"/>

  <!-- episode trials: filled = success, outline = fail -->
  <circle cx="238" cy="30" r="8" fill="#1c5aa6"/>
  <circle cx="238" cy="55" r="8" fill="#1c5aa6"/>
  <circle cx="238" cy="80" r="8" fill="none" stroke="#999" stroke-width="0.5"/>
  <circle cx="238" cy="105" r="8" fill="#1c5aa6"/>
  <circle cx="238" cy="130" r="8" fill="#1c5aa6"/>
  <circle cx="238" cy="155" r="8" fill="none" stroke="#999" stroke-width="0.5"/>
  <circle cx="238" cy="180" r="8" fill="#1c5aa6"/>

  <text x="260" y="14" font-size="12" fill="#666">N episode trials</text>

  <!-- success fraction + CI bracket -->
  <line x1="320" y1="95" x2="320" y2="95" stroke="#333" stroke-width="0.5"/>
  <text x="330" y="70" font-size="14" fill="#1a1a1a">39 / 50 successes</text>
  <text x="330" y="90" font-size="14" fill="#1a1a1a" font-weight="600">= 78%</text>

  <path d="M 330 108 L 330 118 L 470 118 L 470 108" fill="none" stroke="#1c5aa6" stroke-width="0.5"/>
  <line x1="360" y1="112" x2="360" y2="124" stroke="#1c5aa6" stroke-width="0.5"/>
  <text x="400" y="136" font-size="12" text-anchor="middle" fill="#1c5aa6">95% CI: [64.0%, 88.5%]</text>

  <text x="65" y="140" font-size="11" fill="#888" text-anchor="middle">one checkpoint</text>
</svg>
