<svg viewBox="0 0 600 170" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, sans-serif">
  <!-- demonstrations -->
  <rect x="20" y="60" width="130" height="50" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="0.5"/>
  <text x="85" y="90" font-size="13" text-anchor="middle" fill="#333">demonstrations</text>

  <line x1="150" y1="85" x2="215" y2="85" stroke="#666" stroke-width="0.5"/>
  <polygon points="215,85 207,81 207,89" fill="#666"/>

  <!-- training loop -->
  <rect x="220" y="55" width="140" height="60" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="0.5"/>
  <text x="290" y="80" font-size="13" text-anchor="middle" fill="#333">training loop</text>
  <path d="M 270 95 A 10 10 0 1 1 271 95" fill="none" stroke="#1c5aa6" stroke-width="0.5"/>
  <polygon points="271,95 267,89 275,90" fill="#1c5aa6"/>
  <text x="290" y="108" font-size="10" fill="#1c5aa6" text-anchor="middle">fit to demonstrations</text>

  <line x1="360" y1="85" x2="425" y2="85" stroke="#666" stroke-width="0.5"/>
  <polygon points="425,85 417,81 417,89" fill="#666"/>

  <!-- checkpoint = weights + contract -->
  <rect x="430" y="40" width="150" height="90" rx="6" fill="#f7f7f7" stroke="#999" stroke-width="0.5"/>
  <text x="505" y="58" font-size="13" text-anchor="middle" fill="#333">checkpoint</text>
  <rect x="440" y="68" width="130" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.5"/>
  <text x="505" y="85" font-size="11" text-anchor="middle" fill="#555">weights</text>
  <rect x="440" y="100" width="130" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-width="0.5"/>
  <text x="505" y="117" font-size="11" text-anchor="middle" fill="#555">contract (declared features)</text>

  <text x="85" y="128" font-size="11" fill="#888" text-anchor="middle">what a policy is fit to</text>
</svg>
